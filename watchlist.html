<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vanta/Trade — Watchlist</title>
    <meta name="description" content="Monitor your preferred market watchlist." />
    <meta name="theme-color" content="#111310" />
    <link rel="stylesheet" href="./assets/index-DjKOMQ6G.css" type="text/css" />
  </head>
  <body>
    <main class="terminal-shell">
      <div class="ambient-grid"></div>
      <header class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chart-column" aria-hidden="true">
              <path d="M3 3v16a2 2 0 0 0 2 2h16"></path>
              <path d="M18 17V9"></path>
              <path d="M13 17V5"></path>
              <path d="M8 17v-3"></path>
            </svg>
          </span>
          VANTA<span class="brand-thin">/TRADE</span>
        </a>
        <nav>
          <a href="index.html#terminal">Trade</a>
          <a href="index.html#markets">Markets</a>
          <a href="bots.html">Bots</a>
          <a href="signals.html">Signals</a>
          <a class="active" href="watchlist.html">Watchlist</a>
        </nav>
        <div class="top-actions">
          <div class="connection "><i></i> OFFLINE</div>
          <button class="login-button">Log in with Deriv</button>
        </div>
      </header>

      <section class="bots-main" style="margin-top:18px;">
        <div class="bot-header">
          <div>
            <span class="eyebrow">WATCHLIST</span>
            <h1>Tracked markets</h1>
          </div>
          <div class="bot-actions">
            <button class="secondary-button">Add symbol</button>
            <button class="login-button">Sync</button>
          </div>
        </div>

        <div class="panel-box">
          <h3>Favorites</h3>
          <div class="strategy-row">
            <div class="strategy-meta"><strong>Volatility 100</strong><small>Continuous Indices</small></div>
            <span class="pill">+0.33%</span>
          </div>
          <div class="strategy-row">
            <div class="strategy-meta"><strong>EUR/USD</strong><small>Major Pairs</small></div>
            <span class="pill">+0.12%</span>
          </div>
          <div class="strategy-row">
            <div class="strategy-meta"><strong>BTC/USD</strong><small>Cryptocurrencies</small></div>
            <span class="pill">+1.18%</span>
          </div>
        </div>
      </section>

      <footer>
        <span>Vanta/Trade is an independent interface using Deriv APIs.</span>
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock3" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 6v6h4"></path>
          </svg>
          Real-time execution <b>·</b>
          <a href="https://deriv.com/terms-and-conditions/" target="_blank" rel="noreferrer">Terms &amp; risk</a>
        </span>
      </footer>
    </main>
  </body>
</html>
